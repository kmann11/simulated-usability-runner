# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Dashboard → New → Blueprint → connect this repo → apply.
# After the service is live, set GitHub Actions variable VITE_API_BASE to the
# service HTTPS URL (no trailing slash) and re-run "Deploy frontend to GitHub Pages".
services:
  - type: web
    name: simulated-usability-runner
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    # Chromium is memory-heavy; free (512MB) may OOM on large runs — upgrade to
    # starter if health checks pass but runs crash or the service restarts.
    envVars:
      - key: USABILITY_HEADLESS
        value: "true"
      # Required for GPT-backed decisions. Leave unset to use the fallback policy.
      - key: OPENAI_API_KEY
        sync: false
      # Optional model override (default gpt-4o in the runner).
      - key: USABILITY_MODEL
        sync: false
      # Optional comma-separated extra CORS origins (defaults include kmann11.github.io).
      - key: CORS_ORIGINS
        sync: false
      # Optional shared key for mutating routes. Leave unset for public Pages demo.
      # Do NOT bake the same value into a public VITE_ build unless you accept exposure.
      - key: RUNNER_API_KEY
        sync: false
      # Stress burns CPU/RAM; default off under USABILITY_HEADLESS=true.
      - key: RUNNER_STRESS_ENABLED
        sync: false
